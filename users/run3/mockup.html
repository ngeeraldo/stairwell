<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#16181d;
    --mid:#5c6472;
    --faint:#9aa2b1;
    --line:#e4e7ec;
    --accent:#1f6feb;
    --pace:#c2b39a;
    --good:#137a4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
  }
  .wrap{
    max-width:1320px;
    margin:0 auto;
    padding:20px 16px 56px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin:4px 0 18px;
  }
  h1{
    font-size:1.15rem;
    letter-spacing:-.01em;
    margin:0;
    font-weight:650;
  }
  .today{
    font-size:.8rem;
    color:var(--faint);
  }
  .grid{
    display:grid;
    gap:16px;
    grid-template-columns:1fr;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 20px;
  }
  .card h2{
    margin:0 0 14px;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--faint);
    font-weight:650;
  }

  /* hero */
  .hero{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .hero .num{
    font-size:4.6rem;
    line-height:.92;
    font-weight:680;
    letter-spacing:-.035em;
  }
  .hero .unit{
    font-size:1.1rem;
    color:var(--mid);
    font-weight:600;
  }
  .sub{
    margin-top:14px;
    font-size:.95rem;
    color:var(--mid);
  }
  .sub .ahead{color:var(--good);font-weight:640;}
  .sub .dot{color:var(--line);margin:0 8px;}

  /* chart */
  .chartbox{width:100%;}
  svg{width:100%;height:auto;display:block;}
  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:12px;
    font-size:.78rem;
    color:var(--mid);
  }
  .legend span.sw{
    display:inline-block;
    width:16px;height:3px;
    border-radius:2px;
    vertical-align:middle;
    margin-right:7px;
  }
  .sw.avg{background:var(--accent);}
  .sw.pc{background:var(--pace);}
  .sw.raw{background:#c9d0da;height:7px;width:7px;border-radius:50%;}

  /* entry */
  .entered{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:16px;
  }
  .entered .val{font-size:2.5rem;font-weight:660;letter-spacing:-.03em;line-height:1;}
  .entered .delta{font-size:.95rem;color:var(--good);font-weight:620;}
  .entered .lb{font-size:.9rem;color:var(--mid);}
  form{display:grid;gap:10px;grid-template-columns:1fr;}
  .field label{
    display:block;
    font-size:.72rem;
    color:var(--faint);
    text-transform:uppercase;
    letter-spacing:.07em;
    margin-bottom:5px;
    font-weight:640;
  }
  .inp{
    width:100%;
    border:1px solid #d6dbe3;
    border-radius:10px;
    padding:11px 12px;
    font-size:1.05rem;
    color:var(--ink);
    background:#fbfcfd;
    font-family:inherit;
  }
  .save{
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:1rem;
    font-weight:640;
    padding:12px 14px;
    width:100%;
    font-family:inherit;
  }
  .params{
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:.76rem;
    color:var(--faint);
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }

  @media (min-width:620px){
    form{grid-template-columns:1fr 1fr;}
    .save{grid-column:1 / -1;}
  }
  @media (min-width:900px){
    .wrap{padding:32px 28px 64px;}
    h1{font-size:1.35rem;}
    .grid{
      grid-template-columns:1.75fr 1fr;
      grid-template-areas:
        "chart togo"
        "chart entry";
      align-items:start;
    }
    .p-chart{grid-area:chart;}
    .p-togo{grid-area:togo;}
    .p-entry{grid-area:entry;}
    .card{padding:22px 24px 24px;}
    .hero .num{font-size:5.4rem;}
    .save{grid-column:1 / -1;}
  }
  @media (min-width:1180px){
    .hero .num{font-size:6rem;}
    .grid{grid-template-columns:2fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Morning</h1>
    <div class="today">Week 3 &middot; day 19 of 70</div>
  </header>

  <div class="grid">

    <section class="card p-chart">
      <h2>Trend vs pace</h2>
      <div class="chartbox">
        <svg viewBox="0 0 700 250" role="img" aria-label="Seven-day average weight against the ten-week pace line">
          <!-- gridlines -->
          <line x1="40" y1="45" x2="685" y2="45" stroke="#eceff3" stroke-width="1"/>
          <line x1="40" y1="128.4" x2="685" y2="128.4" stroke="#eceff3" stroke-width="1"/>
          <line x1="40" y1="211.8" x2="685" y2="211.8" stroke="#eceff3" stroke-width="1"/>
          <text x="32" y="49" text-anchor="end" font-size="11" fill="#9aa2b1" font-family="sans-serif">200</text>
          <text x="32" y="132" text-anchor="end" font-size="11" fill="#9aa2b1" font-family="sans-serif">195</text>
          <text x="32" y="215" text-anchor="end" font-size="11" fill="#9aa2b1" font-family="sans-serif">190</text>

          <!-- pace line -->
          <line x1="40" y1="38.3" x2="680" y2="205" stroke="#c2b39a" stroke-width="2.5" stroke-dasharray="1 0"/>
          <circle cx="680" cy="205" r="3.5" fill="#c2b39a"/>

          <!-- raw daily points -->
          <g fill="#c9d0da">
            <circle cx="40" cy="38.3" r="2.6"/>
            <circle cx="49.1" cy="30.0" r="2.6"/>
            <circle cx="58.3" cy="43.4" r="2.6"/>
            <circle cx="67.4" cy="51.7" r="2.6"/>
            <circle cx="76.6" cy="41.7" r="2.6"/>
            <circle cx="85.7" cy="56.7" r="2.6"/>
            <circle cx="94.9" cy="53.4" r="2.6"/>
            <circle cx="104" cy="61.7" r="2.6"/>
            <circle cx="113.1" cy="48.4" r="2.6"/>
            <circle cx="122.3" cy="71.7" r="2.6"/>
            <circle cx="131.4" cy="66.7" r="2.6"/>
            <circle cx="140.6" cy="76.7" r="2.6"/>
            <circle cx="149.7" cy="63.4" r="2.6"/>
            <circle cx="158.9" cy="83.4" r="2.6"/>
            <circle cx="168" cy="78.4" r="2.6"/>
            <circle cx="177.1" cy="86.7" r="2.6"/>
            <circle cx="186.3" cy="75.1" r="2.6"/>
            <circle cx="195.4" cy="95.1" r="2.6"/>
            <circle cx="204.6" cy="91.8" r="2.6"/>
          </g>

          <!-- 7-day average -->
          <polyline fill="none" stroke="#1f6feb" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
            points="94.9,46.7 104,50.0 113.1,55.0 122.3,60.0 131.4,63.4 140.6,68.4 149.7,71.7 158.9,75.1 168,76.7 177.1,80.1 186.3,81.8 195.4,83.4 204.6,85.1"/>
          <circle cx="204.6" cy="85.1" r="5" fill="#1f6feb"/>
          <circle cx="204.6" cy="85.1" r="9" fill="#1f6feb" fill-opacity=".14"/>

          <!-- x axis -->
          <line x1="40" y1="232" x2="685" y2="232" stroke="#e4e7ec" stroke-width="1"/>
          <text x="40" y="246" font-size="11" fill="#9aa2b1" font-family="sans-serif">Week 1</text>
          <text x="360" y="246" text-anchor="middle" font-size="11" fill="#9aa2b1" font-family="sans-serif">Week 5</text>
          <text x="685" y="246" text-anchor="end" font-size="11" fill="#9aa2b1" font-family="sans-serif">Week 10</text>
        </svg>
      </div>
      <div class="legend">
        <div><span class="sw avg"></span>7-day average</div>
        <div><span class="sw pc"></span>Pace to 190.4</div>
        <div><span class="sw raw"></span>Daily weigh-in</div>
      </div>
    </section>

    <section class="card p-togo">
      <h2>Pounds to go</h2>
      <div class="hero">
        <div class="num">7.2</div>
        <div class="unit">lb</div>
      </div>
      <div class="sub">
        <span class="ahead">0.2 lb ahead of pace</span>
        <span class="dot">&middot;</span>7 weeks left
      </div>
    </section>

    <section class="card p-entry">
      <h2>This morning&rsquo;s weigh-in</h2>
      <div class="entered">
        <div class="val">197.2</div>
        <div class="lb">lb</div>
        <div class="delta">&minus;0.6 vs yesterday</div>
      </div>
      <form>
        <div class="field">
          <label for="w">Weight (lb)</label>
          <input class="inp" id="w" type="number" step="0.1" value="197.2">
        </div>
        <div class="field">
          <label for="d">Date</label>
          <input class="inp" id="d" type="date" value="2024-05-14">
        </div>
        <button class="save" type="button">Save</button>
      </form>
      <div class="params">
        <span>Started 200.4 lb</span>
        <span>Target 190.4 lb at week 10</span>
      </div>
    </section>

  </div>
</div>
</body>
</html>
