<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk now?</title>
<style>
  :root{
    --bg:#0f1417;
    --panel:#171e22;
    --line:#26313a;
    --ink:#f2f6f8;
    --muted:#93a3ad;
    --no:#ff6b5e;
    --yes:#4ede9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.35;
  }
  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:24px 20px 56px;
  }
  header.screen{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:8px 4px 22px;
  }
  header.screen h1{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--muted);
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    gap:18px;
    grid-template-columns:1fr;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    margin:0 0 auto;
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  /* verdict */
  .verdict{
    min-height:260px;
    justify-content:space-between;
  }
  .verdict .answer{
    font-size:5.5rem;
    line-height:.95;
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--no);
    margin:26px 0 10px;
  }
  .verdict .reason{
    font-size:1.15rem;
    font-weight:500;
    color:var(--ink);
    max-width:26ch;
  }
  .verdict .ref{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:.85rem;
    color:var(--muted);
  }
  /* window */
  .window{
    min-height:260px;
    justify-content:space-between;
  }
  .window .range{
    font-size:2.9rem;
    line-height:1.05;
    font-weight:700;
    letter-spacing:-.02em;
    margin:26px 0 8px;
  }
  .window .hint{
    font-size:1rem;
    color:var(--muted);
  }
  .window .len{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:.85rem;
    color:var(--muted);
  }
  @media (min-width:720px){
    .wrap{padding:36px 32px 64px;}
    .grid{grid-template-columns:1.35fr 1fr;gap:24px;}
    .panel{padding:28px;}
    .verdict,.window{min-height:340px;}
    .verdict .answer{font-size:8rem;margin-top:30px;}
    .window .range{font-size:3.4rem;}
  }
  @media (min-width:1100px){
    .grid{grid-template-columns:1.5fr 1fr;gap:28px;}
    .verdict,.window{min-height:400px;}
    .verdict .answer{font-size:10.5rem;}
    .verdict .reason{font-size:1.4rem;}
    .window .range{font-size:4rem;}
    .window .hint{font-size:1.1rem;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="screen"><h1>Walk now?</h1></header>

    <div class="grid">
      <section class="panel verdict">
        <h2>Right now</h2>
        <div>
          <div class="answer">No</div>
          <div class="reason">Too hot &mdash; full sun, pavement is running hotter than the air.</div>
        </div>
        <div class="ref">Feels like 96&deg;F &middot; 71% humidity &middot; clear</div>
      </section>

      <section class="panel window">
        <h2>Next good window</h2>
        <div>
          <div class="range">6:40 &ndash; 7:20 AM</div>
          <div class="hint">Tomorrow, in about 13 hours</div>
        </div>
        <div class="len">Feels like 79&deg;F at the start &middot; after sunrise 6:29 AM</div>
      </section>
    </div>
  </div>
</body>
</html>
